<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div class="payments">
      <h3>Registro de pagos</h3>
      <table id="payment-records">
        <thead>
          <tr>
            <th>ID de pago</th>
            <th>Cantidad pagada</th>
            <th>Fecha de pago</th>
            <th>ID de usuario</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="buttons">
        <button id="add-payment-btn">Añadir pago</button>
        <button id="delete-payment-btn">Eliminar pago</button>
      </div>
    </div>
    <div class="duepays">
      <h3>Usuarios que deben renovar su pago</h3>
      <table id="due-pay-users">
        <thead>
          <tr>
            <th>ID de usuario</th>
            <th>Nombre</th>
            <th>Fecha últ. pago</th>
          </tr>
        </thead>
        <tbody>
          
        </tbody>
      </table>
    </div>
    <div class="users">
      <h3>Registro de clientes</h3>
      <table id="users-id">
        <thead>
          <tr>
            <th>ID de usuario</th>
            <th>Nombre</th>
            <th>Cantidad pagada</th>
            <th>Fecha últ. pago</th>
            <th>Activo</th>
          </tr>
        </thead>
        <tbody>
            
        </tbody>
      </table>
      <div class="buttons">
        <button id="add-user-btn">Añadir cliente</button>
      </div>
    </div>
    <div>
      <button id="generate-resume-btn">Resumen</button>
    </div>
  </body>
</html>

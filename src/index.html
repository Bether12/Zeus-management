<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <h1>Registro de pagos y clientes</h1>
    <div class="payments">
      <table id="users-id">
        <thead>
          <tr>
            <td>ID</td>
            <td>Nombre</td>
            <td>Cantidad pagada</td>
            <td>Fecha últ. pago</td>
            <td>Activo</td>
          </tr>
        </thead>
        <tbody>
            
        </tbody>
      </table>
      <div class="buttons">
        <button>Añadir pago</button>
        <button>Editar pago</button>
        <button>Eliminar pago</button>
      </div>
    </div>
    <div class="users">
      <table id="payment-records">
        <thead>
          <tr>
            <td>ID de pago</td>
            <td>Cantidad pagada</td>
            <td>Fecha de pago</td>
            <td>ID de usuario</td>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="buttons">
        <button>Añadir cliente</button>
        <button>Editar cliente</button>
      </div>
    </div>
  </body>
</html>
